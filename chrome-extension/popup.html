<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard Pro</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header Section -->
    <header class="popup-header">
      <div class="header-content">
        <div class="logo-container">
          <img src="icon128.png.png" alt="PhishGuard Pro" class="popup-logo">
          <div class="logo-badge">
            <span class="badge-text">PRO</span>
          </div>
        </div>
        <div class="title-section">
          <h1 class="popup-title">PhishGuard Pro</h1>
          <p class="popup-subtitle">AI-Powered Phishing Detection</p>
        </div>
      </div>
      <div class="status-indicator">
        <div class="status-dot active"></div>
        <span class="status-text">Active</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="popup-main">
      <!-- Action Buttons -->
      <div class="action-section">
        <div class="section-title">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9v-9m0-9v9"/>
          </svg>
          <span>Quick Scan</span>
        </div>
        <div class="popup-actions">
          <button id="check-url" class="action-btn primary-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
            </svg>
            <span>Check Current Page</span>
          </button>
          <button id="check-selection" class="action-btn secondary-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4"/>
              <path d="M21 12c-1 0-2-1-2-2s1-2 2-2 2 1 2 2-1 2-2 2z"/>
            </svg>
            <span>Check Selected Text</span>
          </button>
        </div>
      </div>

      <!-- Loading State -->
      <div id="spinner" class="loading-container" style="display:none;">
        <div class="spinner"></div>
        <p class="loading-text">Analyzing security...</p>
      </div>

      <!-- Results Section -->
      <div id="results-section" class="results-section" style="display:none;">
        <div class="section-title">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4"/>
            <path d="M21 12c-1 0-2-1-2-2s1-2 2-2 2 1 2 2-1 2-2 2z"/>
          </svg>
          <span>Analysis Results</span>
        </div>
        <div id="url-status" class="url-status"></div>
        <div id="result" class="result-container"></div>
      </div>

      <!-- Auto Warning -->
      <div id="auto-warning" class="auto-warning"></div>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="footer-content">
        <div class="footer-stats">
          <div class="stat-item">
            <span class="stat-number">High</span>
            <span class="stat-label">Accuracy</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-number">24/7</span>
            <span class="stat-label">Protection</span>
          </div>
        </div>
        <div class="footer-text">
          <span>Powered by AI • Stay safe online</span>
        </div>
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
